<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - TiketKeretaApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <nav class="bilah-navigasi">
            <div class="wadah">
                <div class="logo">
                    <a href="index.html">TiketKeretaApp</a>
                </div>
                <div class="tautan-navigasi">
                    <a href="index.html">Beranda</a>
                    <a href="login_admin.html">Login</a>
                </div>
                <button class="hamburger" onclick="toggleMobileMenu()" aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </nav>
    </header>
    <div class="mobile-menu" id="mobileMenu">
        <button class="close-btn" onclick="toggleMobileMenu()">&times;</button>
        <a href="index.html" onclick="toggleMobileMenu()">Beranda</a>
        <a href="login_admin.html" onclick="toggleMobileMenu()">Login Admin</a>
    </div>
    <script>function toggleMobileMenu(){ document.getElementById("mobileMenu").classList.toggle("open"); }</script>
    
    <main>
        <section class="halaman-login">
            <div class="konten-login">
                <h2>Login Admin</h2>
                <form action="submit_login_admin.php" method="POST" id="formLoginAdmin">
                    <div class="form-group">
                        <label for="nama">Username:</label>
                        <input type="text" id="nama" name="nama" required>
                    </div>
                    <div class="form-group">
                        <label for="kataSandi">Password:</label>
                        <input type="password" id="kataSandi" name="kataSandi" required>
                    </div>
                    <button type="submit" class="tombol-login">Login</button>
                </form>
                <p><a href="login.html">Login sebagai penumpang</a></p>
            </div>
        </section>
    </main>
</body>
</html>
